ShortDescription: Collects invoices from supplier portals, Proton Mail and folders on a schedule
Description: |-
  Tailride Desktop collects invoices from your supplier portals (Amazon, Stripe, AWS, Google Ads and more), Proton Mail and folders on your computer, on the schedule you choose. It runs from the system tray, can sign in for you (including authenticator-app codes), and keeps your portal passwords in Windows' protected storage instead of on a cloud server. Invoices are uploaded to your Tailride account and passed on to your accounting software.
